name: Data refresh

# AFAD apiv2 yalnızca son ~11 günü servis ediyor; arşiv ancak bu ufuktan sık
# güncellenirse boşluksuz büyür. 6 saatlik cron, birkaç başarısız koşuyu da tolere eder.
# Arşiv (olaylar + manifest + yükseklik cache'i) ayrı `catalog-archive` dalında tutulur:
# main geçmişi veri commit'leriyle kirlenmez (CLAUDE.md: katalog main'e commit edilmez).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # `runner` bağlamı job-level env'de kullanılamaz; yolu adımda $GITHUB_ENV'e yaz.
      - name: Set archive path
        run: echo "ARCHIVE=$RUNNER_TEMP/catalog-archive" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Configure git
        run: |
          git config --global user.name "eyequake-data-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check out archive branch
        run: |
          if git ls-remote --exit-code --heads origin catalog-archive >/dev/null; then
            git fetch origin catalog-archive
            git worktree add --detach "$ARCHIVE" origin/catalog-archive
          else
            git worktree add --detach "$ARCHIVE"
            git -C "$ARCHIVE" switch --orphan catalog-archive
          fi
          mkdir -p data/raw
          if [ -f "$ARCHIVE"/elevation_cache.json ]; then
            cp "$ARCHIVE"/elevation_cache.json data/raw/
          fi

      - name: Update AFAD archive
        id: update
        run: python scripts/12_update_catalog.py --archive-dir "$ARCHIVE" --github-output

      # Yalnızca arşiv yeterli geçmişi kapsıyorsa (varsayılan >= 10 yıl): birkaç
      # günlük veriden kurulan harita servis edilen yüzeyin üstüne yazılmasın.
      - name: Rebuild served surface
        if: steps.update.outputs.export_ready == 'true'
        run: python scripts/run_pipeline.py --skip-fetch --export-web

      - name: Gate served surface
        run: python scripts/run_pipeline.py --check-surface

      - name: Push archive
        run: |
          if [ -f data/raw/elevation_cache.json ]; then
            cp data/raw/elevation_cache.json "$ARCHIVE"/
          fi
          cd "$ARCHIVE"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "data: AFAD arşivi +${{ steps.update.outputs.n_new }} olay (kapsam ${{ steps.update.outputs.history_years }} yıl)"
            git push origin HEAD:catalog-archive
          fi

      - name: Commit refreshed surface
        if: steps.update.outputs.export_ready == 'true'
        run: |
          git add web/data
          if ! git diff --cached --quiet; then
            git commit -m "data: servis yüzeyi AFAD arşivinden yeniden üretildi"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
